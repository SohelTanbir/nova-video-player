<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPlay — Advanced Web Video Player</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="dark">

<!-- ==================== TOP BAR ==================== -->
<div class="topbar">
  <button class="tb-btn" onclick="app.addFiles()" title="Open files (O)"><i class="fa-solid fa-folder-open"></i><span>Open</span></button>
  <button class="tb-btn" onclick="app.addFolder()" title="Open folder"><i class="fa-solid fa-folder-plus"></i><span>Folder</span></button>
  <button class="tb-btn" onclick="app.openUrl()" title="Open URL"><i class="fa-solid fa-link"></i><span>URL</span></button>
  <button class="tb-btn" onclick="app.loadSample()" title="Load a test video"><i class="fa-solid fa-flask"></i><span>Sample</span></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="app.toggleSidebar()" title="Library"><i class="fa-solid fa-layer-group"></i><span>Library</span></button>
  <button class="tb-btn" onclick="app.togglePlaylist()" title="Playlist"><i class="fa-solid fa-list"></i><span>Playlist</span></button>
  <div class="spacer"></div>
  <div class="status" id="status">Ready</div>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="app.showStats()" title="Statistics (I)"><i class="fa-solid fa-chart-simple"></i></button>
  <button class="tb-btn" onclick="app.toggleDrawer()" title="Settings (G)"><i class="fa-solid fa-gear"></i></button>
</div>

<!-- ==================== MAIN ==================== -->
<div class="main">
  <!-- Library -->
  <aside class="sidebar hidden" id="sidebar">
    <div class="panel-head">
      <h3><i class="fa-solid fa-layer-group"></i> Library</h3>
      <button class="icon-btn" onclick="app.toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="recent">Recent</button>
      <button class="tab" data-tab="bookmarks">Bookmarks</button>
      <button class="tab" data-tab="history">History</button>
    </div>
    <div class="tab-panel active" id="tab-recent"><div class="empty" id="recentEmpty">No recent files</div><div id="recentList"></div></div>
    <div class="tab-panel" id="tab-bookmarks"><div class="empty" id="bmEmpty">No bookmarks</div><div id="bmList"></div></div>
    <div class="tab-panel" id="tab-history"><div class="empty" id="histEmpty">No history</div><div id="histList"></div></div>
  </aside>

  <!-- Video -->
  <section class="video-area">
    <div class="video-container fit" id="container">
      <div class="poster" id="poster" onclick="app.playPause()">
        <div class="poster-inner">
          <i class="fa-solid fa-circle-play"></i>
          <div id="posterTitle">No video loaded</div>
          <div id="posterHint">Click Open, drag &amp; drop files, or press Sample</div>
        </div>
      </div>

      <video id="video" playsinline webkit-playsinline preload="metadata"></video>

      <div class="overlay" id="overlay">
        <div class="top-chip"><div class="chip" id="chip" style="display:none"></div></div>

        <div class="center-ctl">
          <button class="big-btn" id="btnPrevBig" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
          <button class="big-btn" id="btnPlay" title="Play/Pause (Space)"><i class="fa-solid fa-play"></i></button>
          <button class="big-btn" id="btnNextBig" title="Next"><i class="fa-solid fa-forward-step"></i></button>
        </div>

        <div class="bottom">
          <div class="progress-row">
            <span class="time" id="timeCur">0:00</span>
            <div class="timeline" id="timeline">
              <div class="tl-track">
                <div class="tl-buffer" id="tlBuffer"></div>
                <div class="tl-played" id="tlPlayed"></div>
                <div class="tl-chapters" id="tlChapters"></div>
                <div class="tl-ab" id="tlAb"></div>
                <div class="tl-handle" id="tlHandle"></div>
              </div>
            </div>
            <span class="time right" id="timeDur">0:00</span>
          </div>

          <div class="controls-row">
            <div class="grp">
              <button class="c-btn" id="btnPrev" title="Previous (P / PgUp)"><i class="fa-solid fa-backward-step"></i></button>
              <button class="c-btn" id="btnStop" title="Stop (S)"><i class="fa-solid fa-stop"></i></button>
              <button class="c-btn" id="btnNext" title="Next (N / PgDn)"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="grp">
              <button class="c-btn" id="btnFrameBack" title="Frame back (,)"><i class="fa-solid fa-backward"></i></button>
              <button class="c-btn" id="btnFrameFwd" title="Frame forward (.)"><i class="fa-solid fa-forward"></i></button>
            </div>
            <button class="c-btn" id="btnRepeat" title="Repeat"><i class="fa-solid fa-repeat"></i></button>
            <button class="c-btn" id="btnShuffle" title="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
            <button class="c-btn txt" id="btnAb" title="A-B loop ([ set A, ] set B, \ clear)">A–B</button>

            <div class="spacer"></div>

            <div class="vol-wrap">
              <button class="c-btn" id="btnVol" title="Mute (M)"><i class="fa-solid fa-volume-high"></i></button>
              <input type="range" class="vol-slider" id="volume" min="0" max="1" step="0.01" value="0.8">
            </div>
            <button class="c-btn txt" id="btnSpeed" title="Speed (+ / -)">1×</button>
            <button class="c-btn" id="btnEq" title="Equalizer"><i class="fa-solid fa-sliders"></i></button>
            <button class="c-btn" id="btnSnapshot" title="Snapshot (S key alt)"><i class="fa-solid fa-camera"></i></button>
            <button class="c-btn" id="btnAspect" title="Aspect ratio"><i class="fa-solid fa-crop-simple"></i></button>
            <button class="c-btn" id="btnPip" title="Picture-in-Picture"><i class="fa-solid fa-clone"></i></button>
            <button class="c-btn" id="btnTheater" title="Theater mode (T)"><i class="fa-solid fa-tv"></i></button>
            <button class="c-btn" id="btnFull" title="Fullscreen (F)"><i class="fa-solid fa-expand"></i></button>
          </div>
        </div>
      </div>

      <div class="scrub-tip" id="scrubTip"><img id="scrubImg" alt=""><span id="scrubTime">0:00</span></div>
      <div class="stats" id="stats"></div>
    </div>

    <input type="file" id="fileInput" accept="video/*,.mkv,.avi,.mov,.m4v" multiple style="display:none">
    <input type="file" id="folderInput" webkitdirectory style="display:none">
    <input type="file" id="subInput" accept=".vtt,.srt" style="display:none">
    <input type="file" id="chapterInput" accept=".vtt,.txt" style="display:none">
  </section>

  <!-- Playlist -->
  <aside class="playlist hidden" id="playlistPanel">
    <div class="panel-head">
      <h3><i class="fa-solid fa-list"></i> Playlist</h3>
      <div class="pl-actions">
        <button class="icon-btn" onclick="app.addFiles()" title="Add files"><i class="fa-solid fa-plus"></i></button>
        <button class="icon-btn" onclick="app.importPlaylist()" title="Import .m3u"><i class="fa-solid fa-file-import"></i></button>
        <button class="icon-btn" onclick="app.exportPlaylist()" title="Export .m3u"><i class="fa-solid fa-file-export"></i></button>
        <button class="icon-btn" id="btnViewToggle" onclick="app.toggleView()" title="Grid / list view"><i class="fa-solid fa-table-cells"></i></button>
        <button class="icon-btn danger" onclick="app.clearPlaylist()" title="Clear"><i class="fa-solid fa-trash"></i></button>
        <button class="icon-btn" onclick="app.togglePlaylist()" title="Hide"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <div class="pl-search"><input type="text" id="plSearch" placeholder="Search playlist..."></div>
    <div class="pl-body"><ul class="pl-list" id="plList"></ul></div>
    <div class="pl-footer"><span id="plCount">0 items</span><span id="plTotal">0:00</span></div>
  </aside>
</div>

<!-- ==================== SETTINGS DRAWER ==================== -->
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3><i class="fa-solid fa-gear"></i> Settings</h3>
    <button class="icon-btn" onclick="app.toggleDrawer()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="drawer-body">
    <!-- Interface -->
    <div class="sec">
      <h4>Interface</h4>
      <div class="row"><label>Theme</label>
        <div class="theme-btns" id="themeBtns">
          <button data-theme="dark" class="active">Dark</button>
          <button data-theme="light">Light</button>
          <button data-theme="oled">OLED</button>
        </div>
      </div>
      <div class="row"><label>Accent</label>
        <div class="swatches" id="accentSwatches"></div>
      </div>
      <div class="row"><label>Playlist layout</label>
        <select id="setView" onchange="app.setView(this.value)"><option value="list">List</option><option value="grid">Grid</option></select>
      </div>
    </div>

    <!-- Playback -->
    <div class="sec">
      <h4>Playback</h4>
      <div class="row"><label>Seek step (sec)</label><select id="setSeek" onchange="app.setSeekStep(this.value)"><option>2</option><option selected>5</option><option>10</option><option>30</option></select></div>
      <div class="row"><label>Playback speed</label><select id="setSpeed" onchange="app.setSpeed(this.value)"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option></select></div>
      <div class="row"><label>Resume playback</label><input type="checkbox" id="setResume" checked onchange="app.setResume(this.checked)"></div>
      <div class="row"><label>Auto-play next</label><input type="checkbox" id="setAutoplay" checked onchange="app.setAutoplay(this.checked)"></div>
    </div>

    <!-- Audio -->
    <div class="sec">
      <h4>Audio</h4>
      <div class="row"><label>Volume boost</label><input type="range" id="setBoost" min="1" max="4" step="0.1" value="1" oninput="app.setBoost(this.value)"><span class="val" id="boostVal">100%</span></div>
      <div class="eq-bands" id="eqBands"></div>
      <div class="eq-presets" id="eqPresets"></div>
    </div>

    <!-- Video -->
    <div class="sec">
      <h4>Video</h4>
      <div class="row"><label>Brightness</label><input type="range" id="setBright" min="0.3" max="2" step="0.05" value="1" oninput="app.setFilter('brightness',this.value)"><span class="val" id="brightVal">100%</span></div>
      <div class="row"><label>Contrast</label><input type="range" id="setContrast" min="0.3" max="2" step="0.05" value="1" oninput="app.setFilter('contrast',this.value)"><span class="val" id="contrastVal">100%</span></div>
      <div class="row"><label>Saturation</label><input type="range" id="setSat" min="0" max="2.5" step="0.05" value="1" oninput="app.setFilter('saturate',this.value)"><span class="val" id="satVal">100%</span></div>
      <div class="row"><label>Rotation</label>
        <div style="display:flex;gap:6px">
          <button class="btn-ghost" onclick="app.rotate(-90)" title="Rotate left"><i class="fa-solid fa-rotate-left"></i></button>
          <button class="btn-ghost" onclick="app.rotate(90)" title="Rotate right"><i class="fa-solid fa-rotate-right"></i></button>
          <button class="btn-ghost" onclick="app.flip('h')" title="Flip horizontal"><i class="fa-solid fa-left-right"></i></button>
          <button class="btn-ghost" onclick="app.flip('v')" title="Flip vertical"><i class="fa-solid fa-up-down"></i></button>
        </div>
      </div>
      <div class="row"><button class="btn-ghost" style="width:100%" onclick="app.resetVideo()">Reset video adjustments</button></div>
    </div>

    <!-- Subtitles -->
    <div class="sec">
      <h4>Subtitles</h4>
      <div class="row"><label>Load subtitles</label><button class="btn-ghost" onclick="app.loadSubFile()">Choose .vtt / .srt</button></div>
      <div class="row"><label>Load chapters</label><button class="btn-ghost" onclick="app.loadChapterFile()">Choose .vtt</button></div>
      <div class="row"><label>Font size</label><input type="range" id="setSubSize" min="12" max="42" value="20" oninput="app.setSubStyle('fontSize',this.value+'px')"><span class="val" id="subSizeVal">20</span></div>
      <div class="row"><label>Text color</label><input type="color" id="setSubColor" value="#ffffff" oninput="app.setSubStyle('color',this.value)"></div>
      <div class="row"><label>Background</label><select id="setSubBg" onchange="app.setSubStyle('bg',this.value)"><option value="rgba(0,0,0,.75)">Dark box</option><option value="transparent">None</option><option value="rgba(0,0,0,.4)">Light box</option></select></div>
      <div class="row"><label>Sync offset</label><input type="range" id="setSubOffset" min="-10" max="10" step="0.1" value="0" oninput="app.setSubOffset(this.value)"><span class="val" id="subOffVal">0s</span></div>
      <div class="row"><button class="btn-ghost" style="width:100%" onclick="app.toggleSub()">Toggle subtitles (C)</button></div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div class="ctx" id="ctx"></div>

<script src="js/app.js"></script>
</body>
</html>
